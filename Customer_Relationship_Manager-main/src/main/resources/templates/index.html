<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Customer Management</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css">
  <script src="/js/script.js" defer></script>
</head>

<body>

<div class="container">

  <!-- Header -->
  <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 style="margin: 0; flex:1; text-align:center;">Customer Management</h1>

    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn btn-danger">Logout</button>
    </form>
  </div>

  <!-- Add Customer -->
  <div style="margin-bottom: 20px;">
    <a href="/showNewCustomerForm" class="btn btn-primary">Add New Customer</a>
  </div>

  <!-- Search -->
  <form th:action="@{/}" method="get" style="margin-bottom: 25px;">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name or email"/>
    <button type="submit">Search</button>
    <a href="/" style="margin-left:10px;">Reset</a>
  </form>

  <!-- Success Message -->
  <div th:if="${successMessage}" class="alert alert-success">
    <span th:text="${successMessage}"></span>
  </div>

  <!-- Table -->
  <table class="table table-bordered">
    <thead>
    <tr>
      <th>S.No</th>

      <th>
        <a th:href="@{/(page=${currentPage}, sortField='firstName', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">
          First Name
        </a>
      </th>

      <th>
        <a th:href="@{/(page=${currentPage}, sortField='lastName', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">
          Last Name
        </a>
      </th>

      <th>
        <a th:href="@{/(page=${currentPage}, sortField='email', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">
          Email
        </a>
      </th>

      <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="customer, iterStat : ${customers}">
      <td th:text="${currentPage * pageSize + iterStat.count}">1</td>
      <td th:text="${customer.firstName}"></td>
      <td th:text="${customer.lastName}"></td>
      <td th:text="${customer.email}"></td>
      <td>
        <a th:href="@{/showFormForUpdate/{id}(id=${customer.id})}" class="btn btn-warning">Edit</a>
        <a th:href="@{/deleteCustomer/{id}(id=${customer.id})}" class="btn btn-danger"
           onclick="return confirm('Are you sure you want to delete this customer?');">Delete</a>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Pagination Info -->
  <p>Current Page: <span th:text="${currentPage}"></span></p>
  <p>Total Pages: <span th:text="${totalPages}"></span></p>

  <!-- Pagination -->
  <div style="margin-top: 15px;">

    <!-- Previous -->
    <a th:if="${currentPage > 0}"
       th:href="@{/(page=${currentPage - 1}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}"
       class="btn btn-secondary">
      Previous
    </a>

    <!-- Page Numbers -->
    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">

      <a th:if="${i != currentPage}"
         th:href="@{/(page=${i}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}"
         th:text="${i + 1}"
         class="btn btn-primary"
         style="margin: 0 3px;">
      </a>

      <span th:if="${i == currentPage}"
            th:text="${i + 1}"
            class="btn btn-success"
            style="margin: 0 3px; font-weight: bold; cursor: default;">
      </span>

    </span>

    <!-- Next -->
    <a th:if="${currentPage < totalPages - 1}"
       th:href="@{/(page=${currentPage + 1}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}"
       class="btn btn-secondary">
      Next
    </a>

  </div>

  <div th:if="${customers.isEmpty()}" class="no-data">
    No customers found
  </div>

</div>

</body>
</html>
